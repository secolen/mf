# 中国移动 App / 10086 签到自动获取 Cookie & 脚本配置

[rewrite_local]
# 1. 获取 Cookie / Token 重写
^https?:\/\/wx\.10086\.cn\/website\/adv\/getAdvList url script-request-header https://raw.githubusercontent.com/ChinaTelecomOperators/ChinaMobile/main/10086.js

# 2. 定时任务 (Cron) - 每天 08:30 执行自动签到/领积分
# 语法说明：cron "分 时 日 月 周" script-path=脚本地址, tag=任务名称
30 8 * * * https://raw.githubusercontent.com/ChinaTelecomOperators/ChinaMobile/main/10086.js, tag=中国移动签到, img-url=https://raw.githubusercontent.com/ChinaTelecomOperators/ChinaMobile/main/icon.png, enabled=true

[mitm]
# MITM 解密域名
hostname = wx.10086.cn, clientaccess.10086.cn
